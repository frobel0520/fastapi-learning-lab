name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm typecheck:web
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c apps/api/constraints-security.txt -e "apps/api[dev]"
      - run: python -m pytest apps/api -p no:cacheprovider
      - run: python -m unittest scripts/test_package_release.py
      - run: python -m unittest scripts/test_export_static_content.py

  runner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c apps/api/constraints-security.txt -e "apps/api[dev]"
      - run: docker build --tag fastapi-learning-lab-runner:test apps/runner
      - name: Run container integration and security matrix
        env:
          FASTAPI_LAB_RUN_CONTAINER_TESTS: "1"
          FASTAPI_LAB_CONTAINER_ENGINE: docker
          FASTAPI_LAB_RUNNER_IMAGE: fastapi-learning-lab-runner:test
        run: python -m pytest apps/api/tests/test_runner_integration.py -p no:cacheprovider -m integration

  browser-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pyodide's stack switching needs the JSPI API shipped with Node 24's V8.
          node-version: '24.22.1'
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c apps/api/constraints-security.txt -e "apps/api[dev]"
      - run: pnpm export:static
      - run: pnpm install --frozen-lockfile
      - name: Run reference solutions in Pyodide
        run: pnpm verify:browser-runner
