[project]
name = "fastapi-learning-lab-api"
version = "0.1.0"
description = "API and exercise contracts for FastAPI Learning Lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.141.1,<0.142",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9"]

[dependency-groups]
cloudflare = ["workers-py", "workers-runtime-sdk"]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "workers-py", "workers-runtime-sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a local container engine and the runner image",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
